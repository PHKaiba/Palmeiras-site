<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Imortais Palmeirenses — Hall of Legends · SE Palmeiras">
    <title>Imortais Palmeirenses | Entrada</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        html,
        body {
            width: 100%;
            height: 100%;
            background: #0a1a0e;
            overflow: hidden;
            /* Evita scroll durante as animações */
        }
        /* ── COLAGEM COM PARALLAX ── */
        
        .collage {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }
        
        .photo {
            position: absolute;
            overflow: hidden;
            transition: transform 0.1s ease-out, filter 0.5s ease, box-shadow 0.5s ease;
            will-change: transform;
            border: 1px solid rgba(201, 168, 76, 0.15);
            /* Moldura sutil */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            pointer-events: auto;
            /* Permite o hover nas fotos */
        }
        /* Ajuste de posições das fotos (Mantendo seu layout original) */
        
        .p1 {
            width: 140px;
            height: 180px;
            top: 5%;
            left: 1.5%;
            transform: rotate(-2deg);
        }
        
        .p2 {
            width: 110px;
            height: 150px;
            top: 2%;
            left: 19%;
            transform: rotate(1.5deg);
        }
        
        .p3 {
            width: 160px;
            height: 120px;
            top: 2%;
            right: 20%;
            transform: rotate(-1deg);
        }
        
        .p4 {
            width: 125px;
            height: 165px;
            top: 3%;
            right: 2%;
            transform: rotate(2deg);
        }
        
        .p5 {
            width: 150px;
            height: 110px;
            top: 26%;
            left: 0;
            transform: rotate(-3deg);
        }
        
        .p6 {
            width: 105px;
            height: 140px;
            top: 30%;
            right: 1%;
            transform: rotate(1deg);
        }
        
        .p7 {
            width: 180px;
            height: 130px;
            bottom: 20%;
            left: 2%;
            transform: rotate(2deg);
        }
        
        .p8 {
            width: 115px;
            height: 158px;
            bottom: 18%;
            right: 4%;
            transform: rotate(-2deg);
        }
        
        .p9 {
            width: 130px;
            height: 95px;
            bottom: 6%;
            left: 16%;
            transform: rotate(1deg);
        }
        
        .p10 {
            width: 144px;
            height: 116px;
            bottom: 5%;
            right: 18%;
            transform: rotate(-1.5deg);
        }
        
        .p11 {
            width: 120px;
            height: 158px;
            top: 48%;
            left: 0%;
            transform: rotate(2.5deg);
        }
        
        .p12 {
            width: 150px;
            height: 108px;
            top: 52%;
            right: 0%;
            transform: rotate(-2deg);
        }
        
        .p13 {
            width: 130px;
            height: 170px;
            bottom: 38%;
            left: 13%;
            transform: rotate(-1.5deg);
        }
        
        .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* AJUSTE DE BRILHO: Fotos menos apagadas e com mais contraste */
            filter: grayscale(20%) brightness(0.8) contrast(1.1);
            display: block;
            transition: all 0.5s ease;
        }
        /* EFEITO DE INTERAÇÃO: A foto "acende" ao passar o mouse */
        
        .photo:hover {
            z-index: 20;
            filter: none;
            transform: scale(1.08) !important;
            border-color: rgba(201, 168, 76, 0.6);
        }
        
        .photo:hover img {
            filter: grayscale(0%) brightness(1.1) contrast(1.1);
        }
        /* ── EFEITOS DE ATMOSFERA ── */
        
        .center-vignette {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            /* Vinheta mais suave no centro para não esconder as fotos */
            background: radial-gradient(circle at center, transparent 0%, rgba(10, 26, 14, 0.2) 50%, #0a1a0e 95%);
        }
        
        .gold-line {
            position: fixed;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(to right, transparent, #c9a84c, transparent);
            opacity: 0.15;
            z-index: 2;
        }
        /* ── CONTEÚDO PRINCIPAL ── */
        
        .hero {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }
        /* ANIMAÇÃO DE ENTRADA DAS LETRAS */
        
        @keyframes revealText {
            from {
                opacity: 0;
                transform: translateY(40px) skewY(5deg);
                filter: blur(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0) skewY(0deg);
                filter: blur(0);
            }
        }
        
        .big-line {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(3rem, 10vw, 8rem);
            letter-spacing: 0.04em;
            line-height: 0.9;
            color: #f5f0e8;
            margin: 0.05em 0;
            text-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
            animation: revealText 1.4s cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }
        
        .line-1 {
            animation-delay: 0.2s;
        }
        
        .line-2 {
            animation-delay: 0.4s;
        }
        
        .line-3 {
            animation-delay: 0.6s;
        }
        
        .gold {
            color: #c9a84c;
        }
        
        .divider {
            width: 80px;
            height: 1px;
            background: #c9a84c;
            margin: 2rem 0;
            opacity: 0.6;
            animation: revealText 1s 0.8s both;
        }
        
        .pre-label {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            color: #c9a84c;
            margin-bottom: 0.8rem;
            animation: revealText 1s 1s both;
        }
        
        .class-year {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(4rem, 12vw, 8rem);
            line-height: 1;
            color: #c9a84c;
            text-shadow: 0 0 40px rgba(201, 168, 76, 0.2);
            animation: revealText 1.2s 1.2s both;
        }
        /* BOTÃO INTERATIVO */
        
        .cta-btn {
            margin-top: 2rem;
            display: inline-flex;
            align-items: center;
            gap: 1rem;
            border: 1px solid #c9a84c;
            color: #c9a84c;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            padding: 1rem 3rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            animation: revealText 1s 1.4s both;
        }
        
        .cta-btn:hover {
            background: #c9a84c;
            color: #0a1a0e;
            box-shadow: 0 0 25px rgba(201, 168, 76, 0.4);
            transform: translateY(-2px);
        }
        /* ESTRELAS */
        
        #stars {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }
        
        .star {
            position: absolute;
            background: #c9a84c;
            border-radius: 50%;
            opacity: 0;
            animation: twinkle var(--d) var(--dl) infinite;
        }
        
        @keyframes twinkle {
            0%,
            100% {
                opacity: 0;
            }
            50% {
                opacity: 0.3;
            }
        }
        /* ── AJUSTE MOBILE: MURAL DENSO E ORGANIZADO ── */
        
        @media (max-width: 768px) {
            .photo {
                width: 95px !important;
                /* Fotos um pouco maiores para preencher mais */
                height: 125px !important;
                filter: grayscale(10%) brightness(0.9) !important;
                /* Mais brilho no celular */
            }
            /* Reativando quase todas as fotos para o efeito "mural" */
            .photo:not(.p5):not(.p9) {
                display: block !important;
            }
            /* Grupo do Topo (Moldura superior) */
            .p1 {
                top: 1%;
                left: -5%;
                transform: rotate(-8deg);
            }
            .p2 {
                top: -2%;
                left: 30%;
                transform: rotate(5deg);
            }
            .p3 {
                top: -2%;
                right: 28%;
                transform: rotate(-4deg);
            }
            .p4 {
                top: 1%;
                right: -5%;
                transform: rotate(8deg);
            }
            /* Laterais (Preenchendo o vácuo ao lado do texto) */
            .p11 {
                top: 35%;
                left: -8%;
                transform: rotate(5deg);
                z-index: 5;
            }
            .p12 {
                top: 42%;
                right: -8%;
                transform: rotate(-6deg);
                z-index: 5;
            }
            .p6 {
                top: 22%;
                right: -5%;
                transform: rotate(10deg);
                opacity: 0.5;
            }
            /* Grupo da Base (Moldura inferior) */
            .p13 {
                bottom: 30%;
                left: -5%;
                transform: rotate(-5deg);
            }
            .p7 {
                bottom: 2%;
                left: -2%;
                transform: rotate(6deg);
            }
            .p10 {
                bottom: 2%;
                right: 22%;
                transform: rotate(-4deg);
            }
            .p8 {
                bottom: 8%;
                right: -2%;
                transform: rotate(-8deg);
            }
            /* Ajuste Fino do Texto Central */
            .big-line {
                font-size: 2.5rem;
                width: 85%;
                margin: 0 auto;
                z-index: 20;
                position: relative;
            }
            .class-year {
                font-size: 4.8rem;
                margin-top: 0.2rem;
            }
            /* Vinheta mais forte nas bordas para "fechar" o mural */
            .center-vignette {
                background: radial-gradient(circle at center, transparent 10%, rgba(10, 26, 14, 0.4) 50%, #0a1a0e 98%);
            }
        }
    </style>
</head>

<body>

    <div id="stars"></div>

    <!-- COLAGEM DE FOTOS COM DATA-SPEED PARA O PARALLAX -->
    <div class="collage" id="parallax-bg">
        <div class="photo p1" data-speed="0.04"><img src="img/foto1.jpg"></div>
        <div class="photo p2" data-speed="0.06"><img src="img/foto2.jpg"></div>
        <div class="photo p3" data-speed="0.03"><img src="img/foto3.jfif"></div>
        <div class="photo p4" data-speed="0.05"><img src="img/foto4.webp"></div>
        <div class="photo p5" data-speed="0.02"><img src="img/foto5.webp"></div>
        <div class="photo p6" data-speed="0.07"><img src="img/foto6.jfif"></div>
        <div class="photo p7" data-speed="0.08"><img src="img/foto7.jpg"></div>
        <div class="photo p8" data-speed="0.04"><img src="img/foto8.webp"></div>
        <div class="photo p9" data-speed="0.05"><img src="img/foto9.jpg"></div>
        <div class="photo p10" data-speed="0.06"><img src="img/foto10.jpg"></div>
        <div class="photo p11" data-speed="0.03"><img src="img/foto11.webp"></div>
        <div class="photo p12" data-speed="0.04"><img src="img/foto12.jpg"></div>
        <div class="photo p13" data-speed="0.05"><img src="img/foto13.webp"></div>
    </div>

    <div class="center-vignette"></div>
    <div class="gold-line" style="top:16%"></div>
    <div class="gold-line" style="bottom:22%"></div>

    <main class="hero">
        <div class="big-line line-1">CELEBRANDO LENDAS</div>
        <div class="big-line line-2">CAMPEÕES E <span class="gold">ÍDOLOS</span></div>
        <div class="big-line line-3">DA HISTÓRIA DO <span class="gold">VERDÃO</span></div>

        <div class="divider"></div>

        <div class="pre-label">Apresentando</div>
        <div class="class-year">2026</div>

        <a class="cta-btn" href="index.html">
            VER OS IMORTAIS
        </a>
    </main>

    <script>
        // GERADOR DE ESTRELAS
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 90; i++) {
            const el = document.createElement('div');
            el.className = 'star';
            const size = Math.random() * 2 + 0.5;
            el.style.cssText = `
                width: ${size}px; height: ${size}px;
                top: ${Math.random() * 100}%; left: ${Math.random() * 100}%;
                --d: ${3 + Math.random() * 4}s; --dl: ${Math.random() * 5}s;
            `;
            starsContainer.appendChild(el);
        }

        // LÓGICA DE PARALLAX DAS FOTOS
        document.addEventListener("mousemove", (e) => {
            const photos = document.querySelectorAll(".photo");
            const mouseX = e.clientX;
            const mouseY = e.clientY;

            photos.forEach(photo => {
                const speed = photo.getAttribute("data-speed");
                const x = (window.innerWidth / 2 - mouseX) * speed;
                const y = (window.innerHeight / 2 - mouseY) * speed;

                // Aplica o movimento mantendo a rotação fixa do CSS
                photo.style.transform = `translate(${x}px, ${y}px)`;
            });
        });
    </script>
</body>

</html>
