<html lang="pt-BR">

<head>

    <!-- PWA -->
    <link rel="manifest" href="data:application/manifest+json,{
        'name':'Imortais Palmeirenses',
        'short_name':'Imortais',
        'icons':[{'src':'data:image/svg+xml;base64,...','sizes':'192x192'}],
        'theme_color':'#0a1a0e','background_color':'#0a1a0e',
        'display':'standalone','start_url':'./'
    }">
    <meta name="theme-color" content="#0a1a0e">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        html,
        body {
            width: 100%;
            height: 100%;
            background: #0a1a0e;
            overflow: hidden;
        }
        /* ✨ LOADING SCREEN */
        
        #loader {
            position: fixed;
            inset: 0;
            z-index: 999;
            background: #0a1a0e;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 1;
            transition: opacity 0.8s ease;
        }
        
        #loader.fade {
            opacity: 0;
            pointer-events: none;
        }
        
        .loader-bar {
            width: 200px;
            height: 2px;
            background: rgba(201, 168, 76, 0.2);
            border-radius: 1px;
            overflow: hidden;
        }
        
        .loader-fill {
            height: 100%;
            background: linear-gradient(90deg, #c9a84c, #e8c97a);
            width: 0%;
            transition: width 0.1s;
            box-shadow: 0 0 10px #c9a84c;
        }
        /* ── COLAGEM PARALLAX TURBINADA ── */
        
        .collage {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }
        
        .photo {
            position: absolute;
            overflow: hidden;
            transition: all 0.15s cubic-bezier(0.23, 1, 0.32, 1);
            border: 1px solid rgba(201, 168, 76, 0.15);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            pointer-events: auto;
        }
        /* POSIÇÕES (mantendo originais) */
        
        .p1 {
            width: 140px;
            height: 180px;
            top: 5%;
            left: 1.5%;
            transform: rotate(-2deg)
        }
        
        .p2 {
            width: 110px;
            height: 150px;
            top: 2%;
            left: 19%;
            transform: rotate(1.5deg)
        }
        
        .p3 {
            width: 160px;
            height: 120px;
            top: 2%;
            right: 20%;
            transform: rotate(-1deg)
        }
        
        .p4 {
            width: 125px;
            height: 165px;
            top: 3%;
            right: 2%;
            transform: rotate(2deg)
        }
        
        .p5 {
            width: 150px;
            height: 110px;
            top: 26%;
            left: 0;
            transform: rotate(-3deg)
        }
        
        .p6 {
            width: 105px;
            height: 140px;
            top: 30%;
            right: 1%;
            transform: rotate(1deg)
        }
        
        .p7 {
            width: 180px;
            height: 130px;
            bottom: 20%;
            left: 2%;
            transform: rotate(2deg)
        }
        
        .p8 {
            width: 115px;
            height: 158px;
            bottom: 18%;
            right: 4%;
            transform: rotate(-2deg)
        }
        
        .p9 {
            width: 130px;
            height: 95px;
            bottom: 6%;
            left: 16%;
            transform: rotate(1deg)
        }
        
        .p10 {
            width: 144px;
            height: 116px;
            bottom: 5%;
            right: 18%;
            transform: rotate(-1.5deg)
        }
        
        .p11 {
            width: 120px;
            height: 158px;
            top: 48%;
            left: 0%;
            transform: rotate(2.5deg)
        }
        
        .p12 {
            width: 150px;
            height: 108px;
            top: 52%;
            right: 0%;
            transform: rotate(-2deg)
        }
        
        .p13 {
            width: 130px;
            height: 170px;
            bottom: 38%;
            left: 13%;
            transform: rotate(-1.5deg)
        }
        
        .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(25%) brightness(0.75) contrast(1.15);
            transition: all 0.4s ease;
        }
        
        .photo:hover {
            z-index: 25;
            filter: brightness(1.15) !important;
            transform: scale(1.12) !important;
            border-color: rgba(201, 168, 76, 0.8);
            box-shadow: 0 20px 60px rgba(201, 168, 76, 0.15);
        }
        
        .photo:hover img {
            filter: grayscale(0%) brightness(1.2) contrast(1.2);
        }
        /* ✨ PARTICLES */
        
        @keyframes particle {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--dx), var(--dy)) scale(0);
                opacity: 0;
            }
        }
        
        .particle {
            position: fixed;
            width: 6px;
            height: 6px;
            background: #c9a84c;
            border-radius: 50%;
            pointer-events: none;
            z-index: 30;
            box-shadow: 0 0 8px #c9a84c;
        }
        /* ── ATMOSFERA ── */
        
        .center-vignette {
            position: fixed;
            inset: 0;
            z-index: 2;
            background: radial-gradient(circle at center, transparent 0%, rgba(10, 26, 14, 0.25) 50%, #0a1a0e 95%);
        }
        
        .gold-line {
            position: fixed;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(to right, transparent, #c9a84c, transparent);
            opacity: 0.18;
            z-index: 3;
        }
        /* ── HERO TURBINADO ── */
        
        .hero {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }
        
        @keyframes revealText {
            from {
                opacity: 0;
                transform: translateY(50px) skewY(3deg);
                filter: blur(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0) skewY(0);
                filter: blur(0);
            }
        }
        
        .big-line {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(3.2rem, 11vw, 9rem);
            letter-spacing: 0.05em;
            line-height: 0.88;
            color: #f5f0e8;
            margin: 0.04em 0;
            text-shadow: 0 12px 50px rgba(0, 0, 0, 0.95);
            animation: revealText 1.6s cubic-bezier(0.22, 0.85, 0.22, 1) both;
        }
        
        .line-1 {
            animation-delay: 0.3s;
        }
        
        .line-2 {
            animation-delay: 0.6s;
        }
        
        .line-3 {
            animation-delay: 0.9s;
        }
        
        .gold {
            color: #c9a84c;
            text-shadow: 0 0 30px rgba(201, 168, 76, 0.4);
        }
        
        .divider {
            width: 100px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #c9a84c, transparent);
            margin: 2.5rem 0;
            opacity: 0.7;
            animation: revealText 1.2s 1.2s both;
        }
        
        .pre-label {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 0.6em;
            text-transform: uppercase;
            color: #c9a84c;
            margin-bottom: 1rem;
            animation: revealText 1.2s 1.5s both;
        }
        
        .class-year {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(4.5rem, 14vw, 9.5rem);
            line-height: 1;
            background: linear-gradient(135deg, #c9a84c, #e8c97a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
            animation: revealText 1.5s 1.8s both;
        }
        /* 🎯 CTA TURBINADO */
        
        .cta-row {
            display: flex;
            gap: 1rem;
            align-items: center;
            margin-top: 3rem;
            animation: revealText 1.2s 2.2s both;
        }
        
        .cta-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.8rem;
            border: 2px solid #c9a84c;
            color: #c9a84c;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            padding: 1.2rem 3.5rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            overflow: hidden;
            background: rgba(201, 168, 76, 0.05);
        }
        
        .cta-btn:hover {
            background: #c9a84c;
            color: #0a1a0e;
            box-shadow: 0 0 40px rgba(201, 168, 76, 0.5);
            transform: translateY(-4px) scale(1.02);
        }
        
        .cta-share {
            border: 2px solid rgba(201, 168, 76, 0.4);
            color: rgba(201, 168, 76, 0.8);
            font-size: 0.85rem;
            padding: 1rem 2rem;
            opacity: 0;
            animation: fadeInUp 0.8s 2.8s both;
        }
        
        .cta-share:hover {
            border-color: #c9a84c;
            color: #c9a84c;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        /* 🌟 ESTRELAS */
        
        #stars {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }
        
        .star {
            position: absolute;
            background: #c9a84c;
            border-radius: 50%;
            opacity: 0;
            animation: twinkle var(--d) var(--dl) infinite;
            box-shadow: 0 0 6px rgba(201, 168, 76, 0.4);
        }
        
        @keyframes twinkle {
            0%,
            100% {
                opacity: 0;
                transform: scale(0.8);
            }
            50% {
                opacity: 0.35;
                transform: scale(1.2);
            }
        }
        /* 📱 MOBILE PERFEITO */
        
        @media (max-width: 768px) {
            .photo {
                width: 100px !important;
                height: 130px !important;
                filter: grayscale(15%) brightness(0.95) !important;
            }
            .photo:not(.p5):not(.p9) {
                display: block !important;
            }
            /* Mobile positions otimizadas */
            .p1 {
                top: 1%;
                left: -6%;
                transform: rotate(-8deg)
            }
            .p2 {
                top: -1%;
                left: 28%;
                transform: rotate(6deg)
            }
            .p3 {
                top: -1%;
                right: 28%;
                transform: rotate(-5deg)
            }
            .p4 {
                top: 1%;
                right: -6%;
                transform: rotate(9deg)
            }
            .p11 {
                top: 34%;
                left: -10%;
                transform: rotate(6deg);
                z-index: 6
            }
            .p12 {
                top: 40%;
                right: -10%;
                transform: rotate(-7deg);
                z-index: 6
            }
            .p6 {
                top: 20%;
                right: -6%;
                transform: rotate(12deg)
            }
            .p13 {
                bottom: 28%;
                left: -6%;
                transform: rotate(-6deg)
            }
            .p7 {
                bottom: 1%;
                left: -3%;
                transform: rotate(7deg)
            }
            .p10 {
                bottom: 1%;
                right: 20%;
                transform: rotate(-5deg)
            }
            .p8 {
                bottom: 7%;
                right: -3%;
                transform: rotate(-9deg)
            }
            .big-line {
                font-size: 2.8rem;
                width: 90%;
            }
            .class-year {
                font-size: 5.2rem;
            }
            .cta-row {
                flex-direction: column;
                gap: 0.8rem;
            }
            .cta-share {
                opacity: 1 !important;
            }
            .center-vignette {
                background: radial-gradient(circle at center, transparent 8%, rgba(10, 26, 14, 0.45) 50%, #0a1a0e 97%);
            }
        }
        /* PWA INSTALL */
        
        #install-prompt {
            position: fixed;
            bottom: 1rem;
            left: 50%;
            transform: translateX(-50%) translateY(100%);
            background: #c9a84c;
            color: #0a1a0e;
            padding: 1rem 2rem;
            border-radius: 50px;
            font-family: 'Barlow Condensed';
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 10px 40px rgba(201, 168, 76, 0.4);
            z-index: 1000;
            transition: transform 0.4s ease;
        }
        
        #install-prompt.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>

<body>
    <!-- 🚀 LOADING -->

            <div class="loader-fill" id="loader-fill"></div>
        </div>
    </div>

    <div id="stars"></div>

    <!-- COLAGEM -->
    <div class="collage" id="parallax-bg">
        <div class="photo p1" data-speed="0.04"><img src="img/foto1.jpg" loading="eager" alt="Palmeiras Legend"></div>
        <div class="photo p2" data-speed="0.06"><img src="img/foto2.jpg" loading="eager" alt="Palmeiras Legend"></div>
        <div class="photo p3" data-speed="0.03"><img src="img/foto3.jfif" loading="eager" alt="Palmeiras Legend"></div>
        <div class="photo p4" data-speed="0.05"><img src="img/foto4.webp" loading="eager" alt="Palmeiras Legend"></div>
        <div class="photo p5" data-speed="0.02"><img src="img/foto5.webp" loading="eager" alt="Palmeiras Legend"></div>
        <div class="photo p6" data-speed="0.07"><img src="img/foto6.jfif" loading="eager" alt="Palmeiras Legend"></div>
        <div class="photo p7" data-speed="0.08"><img src="img/foto7.jpg" loading="eager" alt="Palmeiras Legend"></div>
        <div class="photo p8" data-speed="0.04"><img src="img/foto8.webp" loading="eager" alt="Palmeiras Legend"></div>
        <div class="photo p9" data-speed="0.05"><img src="img/foto9.jpg" loading="eager" alt="Palmeiras Legend"></div>
        <div class="photo p10" data-speed="0.06"><img src="img/foto10.jpg" loading="eager" alt="Palmeiras Legend"></div>
        <div class="photo p11" data-speed="0.03"><img src="img/foto11.webp" loading="eager" alt="Palmeiras Legend"></div>
        <div class="photo p12" data-speed="0.04"><img src="img/foto12.jpg" loading="eager" alt="Palmeiras Legend"></div>

            </a>

                 COMPARTILHAR
            </a>
        </div>
    </main>

    <!-- 📱 PWA INSTALL -->
    <button id="install-prompt">📱 INSTALAR APP</button>

    <script>
        // 🎵 AUDIO CONTEXT (Sons sutis)
        const audioCtx = new(window.AudioContext || window.webkitAudioContext)();

        // 🔄 LOADING + PRELOAD
        let loadedImgs = 0;
        const totalImgs = 13;

        function imgLoaded() {
            loadedImgs++;
            document.getElementById('loader-fill').style.width = (loadedImgs / totalImgs * 100) + '%';
            if (loadedImgs >= totalImgs) {
                setTimeout(() => document.getElementById('loader').classList.add('fade'), 400);
                if (audioCtx.state === 'suspended') audioCtx.resume();
            }
        }
        document.querySelectorAll('img').forEach(img => {
            if (img.complete) imgLoaded();
            else img.onload = imgLoaded;
        });

        // 🌟 ESTRELAS (mais!)
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 120; i++) {
            const el = document.createElement('div');
            el.className = 'star';
            const size = Math.random() * 3 + 0.3;
            el.style.cssText = `
                width:${size}px;height:${size}px;
                top:${Math.random()*100}%;left:${Math.random()*100}%;
                --d:${2.5+Math.random()*5}s;--dl:${Math.random()*6}s;
            `;
            starsContainer.appendChild(el);
        }

        // ✨ PARALLAX + PARTICLES
        document.addEventListener('mousemove', e => {
            const photos = document.querySelectorAll('.photo');
            const mx = e.clientX,
                my = e.clientY;
            photos.forEach(photo => {
                const speed = photo.getAttribute('data-speed') || 0.04;
                const x = (window.innerWidth * .5 - mx) * speed;
                const y = (window.innerHeight * .5 - my) * speed;
                photo.style.transform = `translate(${x}px,${y}px)`;
            });
        });

        // 💥 PARTICLES NO HOVER
        document.querySelectorAll('.photo').forEach(photo => {
            photo.addEventListener('mouseenter', e => spawnParticles(e.clientX, e.clientY));
            photo.addEventListener('click', e => {
                spawnParticles(e.clientX, e.clientY, 20); // Mais partículas!
                playSound(523.25, 0.1); // Dó
            });
        });

        function spawnParticles(x, y, count = 12) {
            for (let i = 0; i < count; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const angle = (i / count) * Math.PI * 2;
                const dist = 40 + Math.random() * 60;
                p.style.cssText = `
                    left:${x}px;top:${y}px;
                    --dx:${Math.cos(angle)*dist}px;
                    --dy:${Math.sin(angle)*dist}px;
                    animation-delay:${Math.random()*0.1}s;
                    animation-duration:${0.6+Math.random()*0.4}s;
                `;
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 1200);
            }
        }

        // 🎵 SONS SUTIS
        function playSound(freq, duration = 0.15) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = freq;
            osc.type = 'sine';
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + duration);
        }

        // CTA INTERAÇÕES
        document.querySelector('.cta-btn').addEventListener('mouseenter', () => playSound(659.25, 0.2));
        document.querySelector('.cta-btn').addEventListener('click', () => playSound(783.99, 0.3));

        // 📱 PWA INSTALL
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', e => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('install-prompt').classList.add('show');
        });
        document.getElementById('install-prompt').addEventListener('click', async() => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const {
                    outcome
                } = await deferredPrompt.userChoice;
                deferredPrompt = null;
                document.getElementById('install-prompt').style.display = 'none';
            }
        });

        // ⌨️ KEYBOARD
        document.addEventListener('keydown', e => {
            if (e.key === 'Enter' || e.key === ' ') {
                document.querySelector('.cta-btn').click();
            }
        });

        // 🎉 SHARE API
        if (navigator.share) {
            document.querySelector('.cta-share').addEventListener('click', async() => {
                try {
                    await navigator.share({
                        title: 'Imortais Palmeirenses',
                        text: 'Hall of Legends do Verdão! 🏆🍃',
                        url: window.location.href
                    });
                } catch {}
            });
        }
    </script>
